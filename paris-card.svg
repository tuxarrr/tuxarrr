<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
>

  <defs>

    <clipPath id="round">
      <rect
        width="1200"
        height="300"
        rx="24"
      />
    </clipPath>

    <linearGradient
      id="shade"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#000000"
        stop-opacity="0.18"
      />

      <stop
        offset="100%"
        stop-color="#000000"
        stop-opacity="0.82"
      />
    </linearGradient>

  </defs>

  <g clip-path="url(#round)">

    <image
      href="https://raw.githubusercontent.com/tuxarrr/tuxarrr/main/assets/paris.jpg"
      x="0"
      y="0"
      width="1200"
      height="300"
      preserveAspectRatio="xMidYMid slice"
    />

    <rect
      width="1200"
      height="300"
      fill="url(#shade)"
    />

  </g>

  <rect
    x="1.5"
    y="1.5"
    width="1197"
    height="297"
    rx="23"
    fill="none"
    stroke="#303030"
    stroke-width="3"
  />

  <text
    x="55"
    y="205"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="54"
    font-weight="700"
  >
    tuxarr
  </text>

  <text
    x="58"
    y="248"
    fill="#FFFFFF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="23"
    font-weight="700"
  >
    [CyberSecurity/Cloud/AI] - Student
  </text>

</svg>
