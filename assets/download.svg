<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Animated tuxarr terminal">
  <rect width="1200" height="460" rx="28" fill="#0C0C0C"></rect>
  <rect x="1.5" y="1.5" width="1197" height="457" rx="26.5" fill="none" stroke="#2A2D27" stroke-width="3"></rect>
  <rect x="0" y="0" width="7" height="460" rx="3.5" fill="#F5C400"></rect>

  <rect x="24" y="20" width="1152" height="54" rx="16" fill="#0C0C0C"></rect>
  <text x="48" y="55" fill="#F5C400" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="700">&gt;_</text>
  <text x="95" y="55" fill="#F5F5F5" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="600">github.com/tuxarrr</text>
  <text x="241" y="55" fill="#8A8F85" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">~/profile</text>

  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="52" y="120" fill="#F5C400" font-size="22" font-weight="700">$</text>
    <g clip-path="url(#clip1)">
      <text x="78" y="120" fill="#F5F5F5" font-size="22">whoami</text>
    </g>
    <clipPath id="clip1">
      <rect x="76" y="94" width="0" height="34">
        <animate attributeName="width" values="0;0;105;105;0" keyTimes="0;0.03;0.09;0.96;1" dur="14s" repeatCount="indefinite"></animate>
      </rect>
    </clipPath>

    <text x="78" y="152" fill="#C8CBC5" font-size="20" opacity="0">tuxarr
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.09;0.11;0.96;1" dur="14s" repeatCount="indefinite"></animate>
    </text>

    <text x="52" y="202" fill="#F5C400" font-size="22" font-weight="700">$</text>
    <g clip-path="url(#clip2)">
      <text x="78" y="202" fill="#F5F5F5" font-size="22">cat focus.txt</text>
    </g>
    <clipPath id="clip2">
      <rect x="76" y="176" width="0" height="34">
        <animate attributeName="width" values="0;0;174;174;0" keyTimes="0;0.16;0.25;0.96;1" dur="14s" repeatCount="indefinite"></animate>
      </rect>
    </clipPath>

    <text x="78" y="234" fill="#C8CBC5" font-size="20" opacity="0">CyberSecurity  Cloud Engineering  Artificial Intelligence
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.25;0.28;0.96;1" dur="14s" repeatCount="indefinite"></animate>
    </text>

    <text x="52" y="284" fill="#F5C400" font-size="22" font-weight="700">$</text>
    <g clip-path="url(#clip3)">
      <text x="78" y="284" fill="#F5F5F5" font-size="22">./learning --list</text>
    </g>
    <clipPath id="clip3">
      <rect x="76" y="258" width="0" height="34">
        <animate attributeName="width" values="0;0;226;226;0" keyTimes="0;0.34;0.45;0.96;1" dur="14s" repeatCount="indefinite"></animate>
      </rect>
    </clipPath>

    <text x="78" y="316" fill="#C8CBC5" font-size="19" opacity="0">python  rust  typescript  postgresql  kubernetes  terraform
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.48;0.96;1" dur="14s" repeatCount="indefinite"></animate>
    </text>

    <text x="52" y="366" fill="#F5C400" font-size="22" font-weight="700">$</text>
    <g clip-path="url(#clip4)">
      <text x="78" y="366" fill="#F5F5F5" font-size="22">sudo pacman -S knowledge</text>
    </g>
    <clipPath id="clip4">
      <rect x="76" y="340" width="0" height="34">
        <animate attributeName="width" values="0;0;318;318;0" keyTimes="0;0.56;0.68;0.96;1" dur="14s" repeatCount="indefinite"></animate>
      </rect>
    </clipPath>

    <text x="78" y="398" fill="#8A8F85" font-size="18" opacity="0">resolving dependencies...
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.70;0.96;1" dur="14s" repeatCount="indefinite"></animate>
    </text>

    <text x="78" y="427" fill="#C8CBC5" font-size="18" opacity="0">installing knowledge</text>
    <text x="302" y="427" fill="#F5C400" font-size="18" opacity="0">[████████████████████] 100%</text>

    <animate id="noop" attributeName="opacity" values="1;1" dur="14s" repeatCount="indefinite"></animate>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.76;0.79;0.96;1" dur="14s" repeatCount="indefinite"></animate>
      <rect x="78" y="438" width="230" height="2" rx="1" fill="#2B3029"></rect>
      <rect x="78" y="438" width="230" height="2" rx="1" fill="#F5C400">
        <animate attributeName="width" values="0;230" begin="10.9s" dur="1.6s" repeatCount="indefinite"></animate>
      </rect>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.76;0.79;0.96;1" dur="14s" repeatCount="indefinite"></animate>
      <text x="78" y="427" fill="#C8CBC5" font-size="18">installing knowledge</text>
      <text x="302" y="427" fill="#F5C400" font-size="18">[████████████████████] 100%</text>
    </g>
  </g>

  <rect x="52" y="102" width="12" height="24" rx="2" fill="#F5C400">
    <animate attributeName="opacity" values="1;0;1" dur="0.85s" repeatCount="indefinite"></animate>
    <animate attributeName="x" values="157;157;252;252;305;305;395;395;52" keyTimes="0;0.10;0.16;0.28;0.34;0.49;0.56;0.72;1" dur="14s" repeatCount="indefinite"></animate>
    <animate attributeName="y" values="102;102;184;184;266;266;348;348;102" keyTimes="0;0.10;0.16;0.28;0.34;0.49;0.56;0.72;1" dur="14s" repeatCount="indefinite"></animate>
  </rect>

  <rect x="36" y="84" width="1128" height="1" fill="#181B17"></rect>
  <rect x="36" y="84" width="1128" height="1" fill="#F5C400" opacity="0.035">
    <animate attributeName="y" values="84;444;84" dur="6s" repeatCount="indefinite"></animate>
  </rect>
</svg>